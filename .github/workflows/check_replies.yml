name: Check Replies

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "Campaign name (must have a matching templates/<name>/ folder)"
        required: true
        default: "Kelson_Creators_Licensing"
  schedule:
    # Every 30 minutes. Adjust to taste — tighter = faster stop-on-reply,
    # looser = fewer Actions minutes used.
    - cron: "*/30 * * * *"

jobs:
  check-replies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check replies
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EMAIL_ACCOUNTS_JSON: ${{ secrets.EMAIL_ACCOUNTS_JSON }}
        run: |
          python outreach.py check-replies \
            --campaign "${{ github.event.inputs.campaign || 'Kelson_Creators_Licensing' }}" \
            | tee replies_output.txt
      - name: Add to job summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat replies_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh dashboard
        if: always()
        continue-on-error: true  # a dashboard refresh failure should never mask the reply-check result above
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python outreach.py dashboard --campaign "${{ github.event.inputs.campaign || 'Kelson_Creators_Licensing' }}"
