name: Preview Batch

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "Campaign name (from config/campaigns.yaml)"
        required: true
        default: "sample_campaign"
      stage:
        description: "Stage name (intro, followup1, followup2, followup3, followup4)"
        required: true
        default: "intro"
      batch_size:
        description: "How many leads to preview"
        required: true
        default: "10"
      variant:
        description: 'Variant to force (A/B/C/D), or "Auto" for balanced rotation'
        required: false
        default: "Auto"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run preview
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python outreach.py preview \
            --campaign "${{ github.event.inputs.campaign }}" \
            --stage "${{ github.event.inputs.stage }}" \
            --batch-size "${{ github.event.inputs.batch_size }}" \
            --variant "${{ github.event.inputs.variant }}" \
            | tee preview_output.txt
      - name: Add to job summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat preview_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
