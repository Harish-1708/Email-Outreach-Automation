# One entry per campaign. Add more top-level keys under `campaigns`
# to run multiple independent campaigns from the same repo.
campaigns:
  diaz_event_outreach:
    sheet_id: "PUT_YOUR_GOOGLE_SHEET_ID_HERE"
    master_tab: "Master"
    responses_tab: "Responses"
    send_log_tab: "SendLog"     # optional — defaults to "SendLog" if omitted
    templates_dir: "templates/diaz_event"
    variants: ["A", "B", "C", "D"]

    # Order matters: this defines the sequence a lead moves through.
    stages:
      - name: intro
        template_prefix: intro
        wait_days_after_previous: 0
      - name: followup1
        template_prefix: followup1
        wait_days_after_previous: 3
      - name: followup2
        template_prefix: followup2
        wait_days_after_previous: 4
      - name: followup3
        template_prefix: followup3
        wait_days_after_previous: 5
      - name: followup4
        template_prefix: followup4
        wait_days_after_previous: 5

    sending:
      timezone: "Asia/Kolkata"
      window_start: "09:00"
      window_end: "17:00"
      delay_min_minutes: 3
      delay_max_minutes: 7
      daily_limit: 100

    reply_monitor:
      lookback_hours: 24

  # Example of a SECOND, independent campaign with a shorter sequence and its
  # own sheet — demonstrates that the number of stages is fully config-driven
  # per campaign (not hard-coded to "Intro + 4 follow-ups"). Uncomment and
  # fill in a real sheet_id + templates to use it. Each campaign's sheet is
  # separate, so leads/replies never cross-contaminate between campaigns even
  # if the same person appears in both.
